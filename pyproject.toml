[project]
name = "cybersecurity-threat-detection"
version = "0.1.0"
description = "CTU-13 network-flow threat detection study"
requires-python = ">=3.11"
dependencies = ["certifi>=2025.1", "numpy>=2,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
threat-ctu13-download = "threat_detection.ctu13:download"
threat-ctu13-evaluate = "threat_detection.ctu13:evaluate"
threat-ctu13-backfill = "threat_detection.backfill:backfill"
threat-ctu13-challenger = "threat_detection.challenger:train"
threat-ctu13-load = "threat_detection.load_alerts:load"

[project.optional-dependencies]
research = [
    "dask[dataframe]>=2026.8.0",
    "pyarrow>=26.0.0",
    "torch>=2.14.1",
]
service = [
    "clickhouse-connect>=1.10.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
